name: Gerar vídeo MoneyPrinterTurbo
on:
  push:
    branches: [main]
    paths:
      - "requests/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Pedido existente, exemplo requests/exemplo.json"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: moneyprint-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPT_HOME: /tmp/moneyprint-runtime
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      REQUEST_PATH: ${{ inputs.request_path }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar MoneyPrinterTurbo e Piper offline
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mpt==1.3.9" "piper-tts==1.8.0" "Pillow==11.3.0"
      - name: Garantir FFmpeg e fontes Lato
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Detectar se os pedidos exigem navegador desktop
        id: browser_mode
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.render_request import load_request, select_requests
          files = select_requests(Path.cwd(), manual=os.getenv("REQUEST_PATH", ""),
                                  before=os.getenv("PUSH_BEFORE", ""),
                                  after=os.getenv("PUSH_AFTER", ""))
          browser_mode = any(load_request(file)["visual_mode"] in ("github", "github_cinematic") for file in files)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={str(browser_mode).lower()}\n")
          PY
      - name: Instalar Playwright e Chromium somente para captura desktop
        if: steps.browser_mode.outputs.enabled == 'true'
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Detectar adaptadores open source solicitados
        id: motion_deps
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.render_request import load_request, select_requests
          items = [load_request(p) for p in select_requests(
              Path.cwd(), manual=os.getenv("REQUEST_PATH",""),
              before=os.getenv("PUSH_BEFORE",""), after=os.getenv("PUSH_AFTER",""))]
          flags = {
              "hyperframes": any(i["motion"]["hyperframes_project"] for i in items),
              "threejs": any(i["motion"]["threejs"] for i in items),
              "scenedetect": any(i["motion"]["scene_index"] for i in items),
              "autocut": any(i["motion"]["auto_cut"] for i in items),
          }
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              for name,enabled in flags.items():
                  out.write(f"{name}={str(enabled).lower()}\n")
          PY
      - uses: actions/setup-node@v4
        if: steps.motion_deps.outputs.threejs == 'true' || steps.motion_deps.outputs.hyperframes == 'true'
        with:
          node-version: "22"
      - name: Instalar PySceneDetect livre somente quando solicitado
        if: steps.motion_deps.outputs.scenedetect == 'true'
        run: python -m pip install "scenedetect==0.7.3"
      - name: Instalar Auto-Editor somente quando solicitado
        if: steps.motion_deps.outputs.autocut == 'true'
        run: python -m pip install auto-editor
      - name: Instalar CLI HyperFrames Apache-2.0 somente quando solicitado
        if: steps.motion_deps.outputs.hyperframes == 'true'
        run: npm install -g hyperframes@0.9.23 --ignore-scripts --no-audit --no-fund
      - name: Instalar Three.js livre somente quando solicitado
        if: steps.motion_deps.outputs.threejs == 'true'
        run: npm install --prefix motion/three-universe --ignore-scripts --no-audit --no-fund
      - name: Testes de validação
        run: python -m unittest discover -s tests -v
      - name: Renderizar pedidos novos ou pedido manual
        run: python -m scripts.render_request
      - name: Disponibilizar MP4, roteiro e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-${{ github.run_id }}
          path: outputs/
          retention-days: 7
          if-no-files-found: warn
