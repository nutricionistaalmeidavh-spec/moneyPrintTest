name: Painel visual MoneyPrint (sem API paga)
on:
  push:
    branches: [main, 'feat/moneyprint-visual-flow-builder']
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  pull_request:
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do modelo de grafos
        run: node --test panel/tests/*.test.mjs
      - name: Garantir sincronização dos assets do Worker
        run: node panel/check-bundle.mjs
      - name: Instalar navegador para QA visual real
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: QA desktop e celular
        run: python panel/tests/ui_mobile_e2e.py
      - name: Salvar prints do QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-studio-visual-qa
          path: qa-panel/
          if-no-files-found: warn
          retention-days: 3
      - name: Conferir sintaxe do UI e Worker
        run: |
          node --check panel/flow-core.mjs
          node --check panel/builder.js
          node --check panel/worker.js
          node --check panel/local-server.mjs
