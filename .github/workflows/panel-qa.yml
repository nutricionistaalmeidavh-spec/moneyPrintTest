name: Painel ArtiSys - testes de segurança
on:
  push:
    branches: [main]
    paths:
      - "panel/**"
      - ".github/workflows/panel-qa.yml"
  pull_request:
    paths:
      - "panel/**"
      - ".github/workflows/panel-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar painel e SQLite sem serviços pagos
        run: node --test panel/test.mjs panel/studio.test.mjs
      - name: Validar sintaxe do adaptador self-hosted
        run: node --check panel/local-server.mjs
