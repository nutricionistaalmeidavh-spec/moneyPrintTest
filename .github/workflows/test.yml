name: Testar controlador de vídeos
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow para validar artes locais
        run: python -m pip install "Pillow==11.3.0"
      - name: Testes unitários
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe Python
        run: python -m compileall -q scripts tests
