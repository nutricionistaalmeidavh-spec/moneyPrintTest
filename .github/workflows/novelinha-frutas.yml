name: Novelinha de frutas — planejamento e preflight GPU

on:
  workflow_dispatch:
    inputs:
      story_path:
        description: "Arquivo de episódio versionado em stories/frutalandia/"
        required: true
        default: "stories/frutalandia/audio-do-amanha-ep01.json"
        type: string
      gpu_preflight:
        description: "Testar GPU gratuita Kaggle (consome cota; não gera vídeo)"
        required: false
        default: false
        type: boolean
      kaggle_username:
        description: "Usuário público do Kaggle (necessário somente no preflight GPU)"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/novelinha-frutas.yml"
      - "scripts/novelinha_frutas.py"
      - "stories/frutalandia/**"
      - "tests/test_novelinha_frutas.py"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORY_PATH: ${{ inputs.story_path || 'stories/frutalandia/audio-do-amanha-ep01.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes de contrato e segurança
        run: python -m unittest discover -s tests -v
      - name: Validar caminho e compilar produção
        shell: bash
        run: |
          if ! [[ "$STORY_PATH" =~ ^stories/frutalandia/[A-Za-z0-9_-]+\.json$ ]]; then
            echo "::error::Caminho de episódio não permitido"
            exit 1
          fi
          python scripts/novelinha_frutas.py "$STORY_PATH" --output outputs/frutalandia-plan
      - name: Pacote de direção e vozes (não é um MP4)
        uses: actions/upload-artifact@v4
        with:
          name: novelinha-storyboard-${{ github.run_id }}
          path: outputs/frutalandia-plan/
          retention-days: 7

  kaggle-gpu-preflight:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_preflight == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ inputs.kaggle_username }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar credencial e usuário (sem imprimir Secret)
        shell: bash
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::KAGGLE_API_TOKEN não configurado"; exit 1; }
          [[ "$KAGGLE_USERNAME" =~ ^[A-Za-z0-9_-]{2,40}$ ]] || { echo "::error::Informe usuário válido do Kaggle"; exit 1; }
      - name: Preparar script privado de GPU
        shell: bash
        run: |
          mkdir -p kaggle-preflight
          cat > kaggle-preflight/gpu_probe.py <<'PY'
          import json
          from pathlib import Path
          import torch
          result = {
              "cuda_available": torch.cuda.is_available(),
              "gpu_count": torch.cuda.device_count(),
              "gpu_name": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
          }
          Path("/kaggle/working/gpu_preflight.json").write_text(json.dumps(result, indent=2))
          if not result["cuda_available"]:
              raise RuntimeError("Kaggle não disponibilizou GPU")
          PY
          python - <<'PY'
          import json,os
          from pathlib import Path
          user = os.environ["KAGGLE_USERNAME"].lower()
          metadata = {
              "id": f"{user}/frutalandia-gpu-preflight",
              "title": "Frutalandia GPU Preflight",
              "code_file": "gpu_probe.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": False,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          Path("kaggle-preflight/kernel-metadata.json").write_text(json.dumps(metadata))
          PY
      - name: Publicar e executar notebook privado Kaggle
        shell: bash
        run: |
          python -m pip install "kaggle>=1.7,<2"
          kaggle kernels push -p kaggle-preflight --accelerator NvidiaTeslaT4 --timeout 600
      - name: Acompanhar execução (falhar explicitamente)
        shell: bash
        run: |
          kernel="${KAGGLE_USERNAME,,}/frutalandia-gpu-preflight"
          completed=0
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$kernel" 2>&1)" || { printf '%s\n' "$status"; exit 1; }
            echo "$status"
            lowercase="${status,,}"
            if [[ "$lowercase" == *error* || "$lowercase" == *failed* || "$lowercase" == *cancelled* ]]; then
              exit 1
            fi
            if [[ "$lowercase" == *complete* ]]; then
              completed=1
              break
            fi
            sleep 20
          done
          test "$completed" = 1 || { echo "::error::Kaggle não concluiu no tempo configurado"; exit 1; }
          mkdir -p outputs/kaggle-preflight
          kaggle kernels output "$kernel" -p outputs/kaggle-preflight -o
          test -s outputs/kaggle-preflight/gpu_preflight.json
      - name: Evidência do teste Kaggle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novelinha-kaggle-gpu-${{ github.run_id }}
          path: outputs/kaggle-preflight/
          if-no-files-found: warn
          retention-days: 7
