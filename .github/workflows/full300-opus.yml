name: MoneyPrint — Filme completo 5min Opus (core R$0)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full300-opus.yml'
      - 'scripts/full300_editor.py'
      - 'scripts/opus_motion_adapter.py'
      - 'tests/test_full300_editor.py'
      - 'vendor/opus-motion/**'
  pull_request:
    paths:
      - '.github/workflows/full300-opus.yml'
      - 'scripts/full300_editor.py'
      - 'scripts/opus_motion_adapter.py'
      - 'tests/test_full300_editor.py'
      - 'vendor/opus-motion/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneyprint-full300
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Testar 25 cenas, 5 produtos, MIT e integridade
        run: |
          python -m unittest discover -s tests -p 'test_full300_editor.py' -v
          python -m unittest discover -s tests -p 'test_opus_motion_pilot.py' -v
          python -m unittest discover -s tests -p 'test_pilot24*.py' -v
          python -m compileall -q scripts/full300_editor.py

  render:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências 100% locais, código aberto e sem créditos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato fonts-dejavu-core
          python -m pip install 'Pillow==11.3.0' 'piper-tts==1.8.0' 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Obter modelo local Piper pt-BR (SHA256 validado)
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.render_request import download_piper
          print(download_piper(Path('/tmp/moneyprint-full300-voice')))
          PY
      - name: Renderizar as 25 cenas com motions contextuais + 5 repositórios reais
        run: |
          python -m scripts.full300_editor \
            --project projects/5-sistemas-talkcraft-educacional.json \
            --voice-model /tmp/moneyprint-full300-voice/pt_BR-faber-medium.onnx \
            --out outputs/full300
      - name: QA 9000 frames, 300s, vídeo H264 e narração AAC
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          out=Path('outputs/full300')
          v=out/'moneyprint_5min_opus.mp4'
          d=json.loads((out/'diagnostico_5min.json').read_text(encoding='utf-8'))
          info=json.loads(subprocess.check_output(
             ['ffprobe','-v','error','-count_frames','-show_streams','-show_format','-of','json',str(v)],text=True))
          video=next(s for s in info['streams'] if s['codec_type']=='video')
          audio=next(s for s in info['streams'] if s['codec_type']=='audio')
          assert d['scene_count']==25 and d['frames']==9000
          assert int(video['nb_read_frames'])==9000
          assert video['codec_name']=='h264' and video['width']==1920 and video['height']==1080
          assert audio['codec_name']=='aac'
          assert abs(float(info['format']['duration'])-300)<.16
          assert d['autopublish'] is False and d['remotion_dependency'] is False
          assert (out/'qa_25_cenas.jpg').is_file() and (out/'fontes_reais.json').is_file()
          print('MoneyPrint 5min: vídeo 300 s, 9000 frames, 25 cenas — QA técnico passou.')
          PY
      - name: Exportar vídeo final, QA e diagnósticos (sem publicação)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-full300-opus
          path: |
            outputs/full300/moneyprint_5min_opus.mp4
            outputs/full300/qa_25_cenas.jpg
            outputs/full300/diagnostico_5min.json
            outputs/full300/fontes_reais.json
            outputs/full300/audio/narration.wav
          if-no-files-found: warn
          retention-days: 7
