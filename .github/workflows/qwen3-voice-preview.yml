name: MoneyPrint — amostras Qwen3-TTS VoiceDesign PT-BR (open source)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qwen3-voice-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar motor local CPU sem APIs pagas
        run: |
          command -v ffmpeg
          ffmpeg -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0' 'torchaudio==2.6.0'
          python -m pip install 'qwen-tts==0.1.1'
      - name: Gerar duas vozes brasileiras de narrador (amostras para aprovação)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          import numpy as np
          import soundfile as sf
          from qwen_tts import Qwen3TTSModel
          torch.set_num_threads(4)
          torch.set_num_interop_threads(2)
          out=Path("voice-previews")
          out.mkdir(exist_ok=True)
          text=(
              "Você sabia que uma análise de segurança não é só rodar um scanner? "
              "Primeiro, a gente define o escopo. Depois, investiga, valida os alertas "
              "e transforma as evidências em um relatório que qualquer pessoa consiga entender."
          )
          styles=[
              ("01_jovem_dinamico","Create a natural male Brazilian Portuguese voice, age 24 to 29, authentic São Paulo / southeast Brazil pronunciation. Energetic, charismatic technology explainer, slightly quick conversational rhythm, articulate, expressive with subtle excitement. No European Portuguese accent, no American accent, no artificial broadcaster intonation, no singing."),
              ("02_narrador_descontraido","Create a Brazilian Portuguese-speaking male voice, age 28 to 35, authentic Brazilian accent with neutral Southeast Brazilian pronunciation. Natural popular short-form video storyteller, warm and confident mid-range voice, friendly and animated with excellent storytelling rhythm. Human pauses and emphasis, never robotic, no European Portuguese accent, no imitation of a real person.")
          ]
          model=Qwen3TTSModel.from_pretrained("Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign",device_map="cpu",dtype=torch.bfloat16,attn_implementation="sdpa")
          report=[]
          for name,instruct in styles:
              wavs,sr=model.generate_voice_design(text=text,language="Portuguese",instruct=instruct)
              arr=np.asarray(wavs[0],dtype=np.float32)
              assert arr.size>sr*3 and np.isfinite(arr).all(),f"Invalid audio: {name}"
              rms=float(np.sqrt(np.mean(arr**2)))
              assert 0.001<rms<0.8,f"Audio silent/clipping: {name} {rms}"
              sf.write(out/(name+".wav"),arr,sr)
              report.append({"name":name,"file":name+".wav","duration_seconds":round(len(arr)/sr,2),"rms":rms,"sample_rate":sr,"text":text,"voice_design_instruct":instruct})
              del wavs,arr
          (out/"voice_options.json").write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
          for wav in voice-previews/*.wav; do
            ffmpeg -v error -y -i "$wav" -af loudnorm=I=-16:TP=-1.5:LRA=11 -c:a libmp3lame -b:a 192k "${wav%.wav}.mp3"
          done
      - name: Anexar amostras para aprovação antes de renderizar V3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-qwen3-ptbr-preview-${{ github.run_id }}
          path: voice-previews/
          retention-days: 7
          if-no-files-found: warn
