name: Video Stack P0-P2 (opt-in)
on:
  workflow_dispatch:
    inputs:
      source_artifact_run:
        description: 'Run ID containing input.mp4 artifact named video-source'
        required: true
        type: string
      hook_seconds:
        description: 'Hook duration'
        required: false
        default: '3'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: video-source
          run-id: ${{ inputs.source_artifact_run }}
          github-token: ${{ github.token }}
          path: media
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate input
        run: test -s media/input.mp4
      - name: Render
        run: python3 scripts/video_stack.py --input media/input.mp4 --output output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: moneyprint-video-p0-p2
          path: output/final.mp4
          retention-days: 7
