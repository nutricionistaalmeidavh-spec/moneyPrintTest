name: Coletar 10 ganchos de corte seco
on:
  push:
    branches: [assets/ganchos-virais-10]
    paths: [".github/workflows/coletar-ganchos.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Instalar FFmpeg para verificar e cortar clipes
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Baixar dez videos reais do ViralHook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganchos
          HOOKS=(motorcycle-crash bike-crash-in-hole extreme-bike-crash head-on-crash pool-jump-fail wall-climber face-plant skate-slip truck-flip bad-drop-in)
          [ "${#HOOKS[@]}" -eq 10 ]
          : > ganchos/RELATORIO.txt
          successes=0
          for slug in "${HOOKS[@]}"; do
            url="https://viralhookup.com/api/download/${slug}"
            dst="ganchos/${slug}.mp4"
            echo "Baixando ${url}"
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 1 --connect-timeout 12 --max-time 80 -A "Mozilla/5.0" -o "$dst" "$url" && ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$dst" >/dev/null 2>&1; then
              duration=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$dst")
              bytes=$(stat -c%s "$dst")
              echo "OK ${slug} | ${duration}s | ${bytes} bytes | ${url}" >> ganchos/RELATORIO.txt
              successes=$((successes+1))
            else
              echo "FALHOU ${slug} | ${url}" >> ganchos/RELATORIO.txt
              if [ -f "$dst" ]; then
                file "$dst"
                ffprobe -v error "$dst" 2>&1 | head -n 6 || true
              fi
              rm -f "$dst"
            fi
          done
          echo "MP4s validos: $successes/10"
          if [ -s ganchos/motorcycle-crash.mp4 ]; then
            ffmpeg -nostdin -hide_banner -loglevel error -y -i ganchos/motorcycle-crash.mp4 -t 2.7 -an -vf "fps=30,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,format=yuv420p" -c:v libx264 -crf 20 -preset veryfast -movflags +faststart ganchos/ESCOLHIDO_motociclista_corte_seco_2s7.mp4
            echo "ESCOLHIDO: motorcycle-crash, 2.7 segundos, corte seco sem transicao/legenda" >> ganchos/RELATORIO.txt
          else
            echo "ESCOLHIDO: motorcycle-crash indisponivel; nao foi simulada escolha." >> ganchos/RELATORIO.txt
          fi
          echo "Origem: https://viralhookup.com/ ; confirmar direitos de reutilizacao comercial." >> ganchos/RELATORIO.txt
          cat ganchos/RELATORIO.txt
          test "$successes" -eq 10
      - name: Publicar MP4s como ZIP temporario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-10-ganchos
          path: ganchos/
          retention-days: 7
          if-no-files-found: warn
