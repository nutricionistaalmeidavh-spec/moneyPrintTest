name: Coletar 10 ganchos de corte seco
on:
  push:
    branches: [assets/ganchos-virais-10]
    paths:
      - ".github/workflows/coletar-ganchos.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar e validar 10 MP4s gratuitos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ganchos
          HOOKS=(motorcycle-crash bike-crash-in-hole extreme-bike-crash head-on-crash pool-jump-fail wall-climber face-plant skate-slip truck-flip bad-drop-in)
          [ "${#HOOKS[@]}" -eq 10 ]
          : > ganchos/RELATORIO.txt
          successes=0
          for slug in "${HOOKS[@]}"; do
            url="https://viralhookup.com/api/download/${slug}"
            dst="ganchos/${slug}.mp4"
            echo "Baixando ${url}"
            if curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 80 -A "Mozilla/5.0" -o "$dst" "$url" && ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$dst" >/tmp/probe.txt 2>/dev/null; then
              duration=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$dst")
              bytes=$(stat -c%s "$dst")
              echo "OK ${slug} | ${duration}s | ${bytes} bytes | ${url}" >> ganchos/RELATORIO.txt
              successes=$((successes+1))
            else
              echo "FALHOU ${slug} | ${url}" >> ganchos/RELATORIO.txt
              rm -f "$dst"
            fi
          done
          echo "MP4s validos: $successes/10"
          if [ -s ganchos/motorcycle-crash.mp4 ]; then
            ffmpeg -nostdin -hide_banner -loglevel error -y -i ganchos/motorcycle-crash.mp4 -t 2.7 -an -vf "fps=30,scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,format=yuv420p" -c:v libx264 -crf 20 -preset veryfast -movflags +faststart ganchos/ESCOLHIDO_motociclista_corte_seco_2s7.mp4
            echo "ESCOLHIDO: motorcycle-crash, 2.7 s, sem transicao/legenda" >> ganchos/RELATORIO.txt
          else
            echo "ESCOLHIDO: nao baixado; selecao pendente de validacao visual" >> ganchos/RELATORIO.txt
          fi
          echo "Fonte: https://viralhookup.com/; verificar direitos comerciais antes de publicar." >> ganchos/RELATORIO.txt
          cat ganchos/RELATORIO.txt
          test "$successes" -ge 1
      - name: Disponibilizar clipes como artefato ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-10-ganchos
          path: ganchos/
          retention-days: 7
          if-no-files-found: warn
