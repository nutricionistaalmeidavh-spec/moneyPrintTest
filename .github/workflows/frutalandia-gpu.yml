name: Frutalândia 3D — render Kaggle GPU

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Episódio versionado"
        required: true
        type: choice
        options:
          - stories/frutalandia/audio-do-amanha-ep01.json
      render:
        description: "Enviar para renderização gratuita no Kaggle"
        type: boolean
        default: true
  push:
    branches:
      - feat/novelinha-frutas-openmontage-voicestudio
    paths:
      - triggers/produce-frutalandia.txt

permissions:
  contents: read

concurrency:
  group: frutalandia-gpu-render
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testar controlador, continuidade e pacote Kaggle
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts/frutalandia_blender.py scripts/frutalandia_episode_runner.py scripts/frutalandia_kaggle_bundle.py

  kaggle-render:
    needs: gate
    if: ${{ github.event_name == 'push' || inputs.render == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      STORY_PATH: ${{ inputs.story || 'stories/frutalandia/audio-do-amanha-ep01.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar secret disponível
        shell: bash
        run: |
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "::error::GitHub Secret KAGGLE_API_TOKEN não está disponível para esta Action"
            exit 1
          fi
      - name: Instalar Kaggle CLI e identificar proprietário autenticado
        shell: bash
        run: |
          python -m pip install -q "kaggle>=2.2.4,<3" "kagglehub>=0.3,<1"
          python - <<'PY'
          import os
          import re
          from kagglehub.auth import whoami
          username=whoami(verbose=False)["username"].lower()
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]{1,39}",username):
              raise RuntimeError("Nome de usuário Kaggle incompatível")
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("KAGGLE_OWNER="+username+"\n")
          print("Identidade Kaggle verificada. Nenhuma credencial exibida.")
          PY
      - name: Verificar cota e gerar notebook privado
        shell: bash
        run: |
          kaggle quota
          python -m scripts.frutalandia_kaggle_bundle --story "$STORY_PATH" \
            --username "$KAGGLE_OWNER" --out .kaggle-frutalandia
          python -m py_compile .kaggle-frutalandia/run.py
      - name: Iniciar renderização GPU T4 x2
        shell: bash
        run: |
          kaggle kernels push -p .kaggle-frutalandia --accelerator NvidiaTeslaT4 --timeout 7200
      - name: Monitorar execução (máximo 160 minutos)
        shell: bash
        run: |
          kernel="$KAGGLE_OWNER/frutalandia-ep01"
          completed=0
          for n in $(seq 1 480); do
            status="$(kaggle kernels status "$kernel" 2>&1)" || { echo "$status"; exit 1; }
            simplified="${status,,}"
            if [[ "$simplified" == *error* || "$simplified" == *failed* || "$simplified" == *cancelled* ]]; then
              echo "::error::Kaggle falhou: $status"
              exit 1
            fi
            if [[ "$simplified" == *complete* ]]; then
              echo "Kaggle concluiu."
              completed=1
              break
            fi
            if (( n % 6 == 0 )); then echo "Kaggle: $status"; fi
            sleep 20
          done
          if [[ "$completed" != 1 ]]; then
            echo "::error::Tempo máximo de renderização excedido"
            exit 1
          fi
      - name: Recuperar vídeo gerado
        shell: bash
        run: |
          mkdir -p outputs/frutalandia
          kaggle kernels output "$KAGGLE_OWNER/frutalandia-ep01" -p outputs/frutalandia -o \
            --file-pattern '.*(frutalandia-ep01\.mp4|manifest\.json|capa\.png|captions\.srt|render-status\.json|blender-render-config\.json)$'
          test -s outputs/frutalandia/frutalandia-ep01.mp4 || {
            echo "::error::Kaggle concluiu sem gerar o MP4"; exit 1;
          }
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("outputs/frutalandia/manifest.json").read_text())
          assert manifest["status"]=="rendered", "Vídeo não foi validado"
          assert manifest["auto_publish"] is False
          assert abs(manifest["seconds"] - 48)<1
          assert manifest["dimensions"]==[720,1280]
          print("MP4 registrado e validado:",manifest["video_path"],"48 segundos")
          PY
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 outputs/frutalandia/frutalandia-ep01.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 outputs/frutalandia/frutalandia-ep01.mp4
      - name: Disponibilizar episódio em Artifacts (não publicar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frutalandia-ep01-${{ github.run_id }}
          path: outputs/frutalandia/
          retention-days: 7
          if-no-files-found: warn
