name: Gerar carrossel com fotos gratuitas
on:
  pull_request:
    paths:
      - "scripts/render_carousel.py"
      - "scripts/carousel_media.py"
      - "tests/test_carousel.py"
      - ".github/workflows/carousel.yml"
      - "carousel_requests/*.json"
  push:
    branches: [main, feat/carrosseis-fotos-gratis]
    paths:
      - "carousel_requests/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Pedido existente, ex.: carousel_requests/exemplo.json"
        type: string
        required: false
      request_json:
        description: "JSON do carrossel, enviado pelo Activepieces (sem token)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependência open source (Pillow)
        run: python -m pip install "Pillow>=10,<13"
      - name: Testes antigos e novos
        run: python -m unittest discover -s tests -v

  render:
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      CAROUSEL_REQUEST_JSON: ${{ inputs.request_json }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CAROUSEL_CACHE_DIR: /tmp/moneyprint-carousel-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Preparar fonte legível
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Preparar chave de cache diária
        run: echo "CAROUSEL_CACHE_DAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Cache gratuito de buscas por 24 horas
        uses: actions/cache@v4
        with:
          path: /tmp/moneyprint-carousel-cache
          key: carousel-search-${{ env.CAROUSEL_CACHE_DAY }}
      - name: Preparar pedido inline do Activepieces (sem commit)
        if: ${{ env.CAROUSEL_REQUEST_JSON != '' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.render_carousel import validate_request
          raw = os.environ["CAROUSEL_REQUEST_JSON"]
          if len(raw.encode("utf-8")) > 32000:
              raise ValueError("Pedido do Activepieces ultrapassa limite de 32 KB")
          validated = validate_request(json.loads(raw))
          if os.environ.get("REQUEST_PATH"):
              raise ValueError("Forneça request_json OU request_path, nunca ambos")
          name = os.environ.get("GITHUB_RUN_ID", "manual")
          location = Path("carousel_requests") / ("activepieces-" + name + ".json")
          location.write_text(json.dumps(validated, ensure_ascii=False), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("REQUEST_PATH=" + str(location) + "\n")
          PY
      - name: Gerar fotos com texto (não publica)
        run: python -m scripts.render_carousel
      - name: Entregar JPGs e ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: carousel_outputs/
          retention-days: 30
          if-no-files-found: warn
