name: Gerar carrossel com fotos gratuitas
on:
  pull_request:
    paths:
      - "scripts/render_carousel.py"
      - "tests/test_carousel.py"
      - ".github/workflows/carousel.yml"
      - "carousel_requests/*.json"
  push:
    branches: [main]
    paths:
      - "carousel_requests/*.json"
  workflow_dispatch:
    inputs:
      request_path:
        description: "Pedido existente, ex.: carousel_requests/exemplo.json"
        type: string
        required: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependência open source (Pillow)
        run: python -m pip install "Pillow>=10,<13"
      - name: Testes antigos e novos
        run: python -m unittest discover -s tests -v

  render:
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Preparar fonte legível
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Gerar fotos com texto (não publica)
        run: python scripts/render_carousel.py
      - name: Entregar JPGs e ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_id }}
          path: carousel_outputs/
          retention-days: 7
          if-no-files-found: warn
