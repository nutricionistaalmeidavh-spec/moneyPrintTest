name: QA MoneyPrint Studio — visual beats reais
on:
  pull_request:
    paths:
      - "scripts/studio_render.py"
      - "scripts/studio_visuals.py"
      - "tests/test_studio_beats.py"
      - ".github/workflows/qa-studio-beats.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ferramentas gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-lato fonts-dejavu-core
          python -m pip install "Pillow==11.3.0"
      - name: Testar composição por estágios e MP4 real
        run: python -m unittest discover -s tests -p "test_studio_beats.py" -v
