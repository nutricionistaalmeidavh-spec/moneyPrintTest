name: MoneyPrint - baixar mais 100 ganchos virais
on:
  push:
    branches: [assets/ganchos-virais-10]
    paths:
      - "scripts/download_hook_library.py"
      - "tests/test_download_hook_library.py"
      - ".github/workflows/coletar-mais-100-ganchos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar FFprobe para inspecionar MP4s originais
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Testar catálogo e deduplicação
        run: |
          python -m compileall -q scripts/download_hook_library.py tests/test_download_hook_library.py
          python -m unittest discover -s tests -p "test_download_hook_library.py" -v
      - name: Baixar 100 MP4s adicionais sem editar
        run: python scripts/download_hook_library.py --target 100 --output "100_CORTES_VIRAIS"
      - name: Disponibilizar biblioteca de 100 MP4s e catálogo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-100-cortes-virais-adicionais
          path: "100_CORTES_VIRAIS/"
          retention-days: 14
          if-no-files-found: warn
          compression-level: 2
