name: MoneyPrint — amostra de voz nativa Kokoro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tutorial_mpt_voice.py"
      - "tutorials/narracao_github_energica.txt"
      - ".github/workflows/voice-kokoro-preview.yml"

permissions:
  contents: read

jobs:
  voice_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPT_HOME: /tmp/moneyprint-native-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar MoneyPrinterTurbo (sem API paga)
        run: python -m pip install "mpt==1.3.9"
      - name: Iniciar TTS Kokoro self-hosted (voz pt-BR pm_alex)
        run: |
          docker run -d --rm --name moneyprint-kokoro \
            -p 127.0.0.1:8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0
          ready=false
          for attempt in $(seq 1 100); do
            if curl --noproxy '*' -fsS --max-time 3 http://127.0.0.1:8880/health >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker logs --tail 30 moneyprint-kokoro || true
            echo "Kokoro indisponível. Nenhum serviço externo será acionado."
            exit 1
          fi
      - name: Gerar voz exclusivamente pelo MoneyPrinterTurbo
        run: |
          mkdir -p outputs "$MPT_HOME"
          python scripts/tutorial_mpt_voice.py \
            --script tutorials/narracao_github_energica.txt \
            --voice kokoro:pm_alex --rate 1.08 \
            --output outputs/previa_voz_mpt_kokoro.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 \
            outputs/previa_voz_mpt_kokoro.mp3
      - name: Publicar prévia MP3 para revisão (não publicar em redes)
        uses: actions/upload-artifact@v4
        with:
          name: moneyprint-voz-kokoro-${{ github.run_id }}
          path: outputs/previa_voz_mpt_kokoro.mp3
          retention-days: 7
          if-no-files-found: error
      - name: Remover servidor local
        if: always()
        run: docker rm -f moneyprint-kokoro 2>/dev/null || true
