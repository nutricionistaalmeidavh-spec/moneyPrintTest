<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoneyPrint — Mockups 3D</title>
<style>
:root{font:14px/1.45 system-ui,sans-serif;color:#eef2fb;background:#111320}*{box-sizing:border-box}body{margin:0}
header{padding:19px clamp(15px,4vw,36px);background:#17192a;display:flex;flex-wrap:wrap;align-items:center;gap:13px;justify-content:space-between}
h1{font-size:clamp(19px,4vw,29px);margin:0}.sub{font-size:12px;color:#b8bed5}main{max-width:1440px;margin:auto;padding:15px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:12px}
label{font-size:12px;display:grid;gap:4px;color:#cbd2e5}select,input,button{min-height:42px;border:1px solid #545c79;border-radius:9px;background:#232a41;color:#fff;padding:7px;max-width:100%}
button{cursor:pointer;background:#6558bd}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #c6b7ff}
#viewport{position:relative;overflow:hidden;min-height:270px;height:min(75vh,750px);border-radius:18px;background:#e9e5db}
canvas{display:block;width:100%;height:100%}#message{margin-top:10px;font-size:12px;color:#c7cfe2}
body.render header,body.render .controls,body.render #message{display:none}body.render main{margin:0;padding:0;max-width:none}body.render #viewport{height:100vh;min-height:100vh;border-radius:0}
</style></head><body><header><div><h1>MoneyPrint · Mockups 3D</h1><span class="sub">Geometria tridimensional real, textura de vídeo e câmera animada</span></div><strong class="sub">Three.js (MIT) + FFmpeg</strong></header>
<main><div class="controls">
<label>Dispositivo<select id="device"><option value="laptop">Notebook 3D</option><option value="monitor">Monitor 3D</option></select></label>
<label>Motion<select id="motion"><option value="enter">Entrada</option><option value="orbit">Órbita</option><option value="zoom">Zoom na tela</option><option value="float">Flutuação</option></select></label>
<label>Formato<select id="aspect"><option value="16:9">YouTube 16:9</option><option value="9:16">Shorts 9:16</option><option value="1:1">Quadrado 1:1</option></select></label>
<label>Gravação (MP4/WebM)<input id="videoFile" type="file" accept="video/mp4,video/webm"></label>
<button id="replay" type="button">Reiniciar</button></div>
<div id="viewport"><canvas id="view" aria-label="Dispositivo 3D com gravação real na tela"></canvas></div>
<p id="message">Escolha um vídeo local. Nenhum arquivo é enviado a terceiros. Para renderizar em MP4, utilize o adaptador do MoneyPrint.</p></main>
<video id="screenVideo" muted playsinline preload="auto" loop style="display:none"></video>
<script type="module" src="./scene.mjs"></script></body></html>
